# 台湾闽南语迁移训练配置；在 SOFA 项目根目录运行。
# 预训练路径由 train.py 的 -p 参数提供，YAML 中不添加程序未读取的字段。
# 建议命令：python train.py -c configs/train_config.yaml -d data -p ckpt/Mandarin_Singing_Model.ckpt
model_name: nan_tw_leku_sutiau_cv27

# 数值精度和训练随机种子；该种子不会改变 binarize.py 自身的随机留出逻辑。
float32_matmul_precision: high
random_seed: 114514

# 使用现有 SOFA 环境，在单张 RTX 4090 上训练。
dataloader_workers: 4
# 当前 train.py 在有工作进程时固定使用预取因子 2，此处与其保持一致。
dataloader_prefetch_factor: 2
# 实际采样器按标签编号读取：无标签 0、弱标签 1、完整标签 2。
# 当前没有无标签样本；三个权重仍须全部大于 0，保持原始样本比例。
oversampling_weights: [1, 1, 1]
# 单位：秒。开启增强时，采样器先除以 2，再由双视图展开为实际批次。
batch_max_length: 100
binning_length: 1000
drop_last: false

# 与现有普通话检查点的骨干结构一致；闽南语输出层由当前词表重新构造。
model:
  hidden_dims: 128
  down_sampling_factor: 3
  down_sampling_times: 7
  channels_scaleup_factor: 1.5

optimizer_config:
  # 这是训练上限；是否继续应结合留出集结果及实际对齐质量判断。
  total_steps: 100000
  weight_decay: 0.1
  lr:
    # 较小的骨干学习率用于迁移已有声学特征；新输出层使用原始学习率。
    backbone: 0.0003
    head: 0.0005
  freeze:
    backbone: false
    head: false

# 保留现有七项损失的权重和调度，与项目实现保持兼容。
loss_config:
  losses:
    weights: [10.0, 0.1, 0.01, 0.1, 1.0, 1.0, 5.0]
    enable_RampUpScheduler: [false, false, false, true, true, true, true]
  function:
    num_bins: 10
    alpha: 0.999
    label_smoothing: 0.08
    pseudo_label_ratio: 0.3

# 明确使用单张 GPU；已确认该 4090 和 SOFA 环境支持 BF16。
accelerator: gpu
devices: 1
precision: bf16-mixed
gradient_clip_val: 1.0
gradient_clip_algorithm: norm
# 每个验证样本都会绘图；扩大留出集后降低验证频率以控制开销。
val_check_interval: 2000

