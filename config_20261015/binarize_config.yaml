# 台湾闽南语完整标签与弱标签联合预处理配置。
# 从 SOFA 项目根目录运行；路径均相对于该目录。
melspec_config:
  n_mels: 128
  sample_rate: 44100
  win_length: 1024
  hop_length: 512
  n_fft: 2048
  fmin: 40
  # 保留当前前端的有效频带；原普通话检查点的 32000 超过此采样率的奈奎斯特频率。
  # 迁移时骨干网络不冻结，以适应当前前端和闽南语数据。
  fmax: 16000
  clamp: 0.00001
  scale_factor: 4

# 递归读取 leku、sutiau 的完整标签，以及 Common Voice 的弱标签。
data_folder: data/

# 从完整标签中优先留出 128 条，供验证边界损失；抽样由原预处理程序执行。
# 这些是来源 TextGrid 的留出样本，不能等同于独立人工边界金标准。
valid_set_size: 128
valid_set_preferred_folders:
  - full_label

# SOFA 统一将这些标记映射为编号 0 的 SP，不删除 CSV 中的对应时长。
ignored_phonemes:
  - AP
  - SP
  - <AP>
  - <SP>
  - ''
  - pau
  - cl

# 每条训练样本保存原始特征与 1 份移调特征，供双视图一致性训练使用。
# 采用较小的移调范围，并较原 size=2 减少预处理时间和磁盘用量。
data_augmentation:
  size: 1
  key_shift_choices: [-2, -1, 1, 2]

# 单位：秒。当前已验收样本均不超过此长度。
max_length: 45

